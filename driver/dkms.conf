# dell-smm-hwmon with Dell Pro Micro Plus QBM1250 added to the fan-control whitelist.
# 1.1: one patched source per kernel series in src/ (select-source.sh picks it before the build).
# install.sh fills in the series it prepared; other series are skipped (the kernel's own driver
# loads, the fan stays under BIOS control) — run install.sh again after a new kernel series.
PACKAGE_NAME="dell-smm-hwmon-qbm1250"
PACKAGE_VERSION="1.1"
BUILT_MODULE_NAME[0]="dell-smm-hwmon"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_KERNEL="@SERIES_REGEX@"
PRE_BUILD="select-source.sh ${kernelver}"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
